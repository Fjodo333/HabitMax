<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#0E0F11">
<title>Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E0F11'/%3E%3Cpath d='M98 30 50 102h34l-6 48 52-74H96z' fill='%23F5B841'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#0E0F11}
a{color:#F5B841}a:hover{color:#FFD27A}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #F5B841;outline-offset:2px}
.scroll::-webkit-scrollbar{display:none}
#root{position:fixed;inset:0}
#root::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0E0F11;z-index:50;pointer-events:none}
input,textarea{font-size:16px!important}
input[type=time]{color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<template id="dc-tpl">
<div style="position: relative; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #0E0F11; color: #EDEEF0; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; overflow: hidden">

<div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: calc(max(env(safe-area-inset-top, 0px), 50px) + 30px) 20px 32px; box-sizing: border-box">

<!-- ============ TODAY ============ -->
<sc-if value="{{show.today}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A4AC">{{_hdrDate}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">{{_hdrDay}}</h1>
</div>
<div style="display: flex; gap: 6px">
<button onClick="{{toggleLow}}" aria-pressed="{{low}}" aria-label="Low energy mode" style="min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid {{lowBorder}}; background: {{lowBg}}; color: {{lowFg}}; font-size: 13px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line><line x1="6" y1="10" x2="6" y2="14"></line></svg>
<sc-if value="{{low}}" hint-placeholder-val="{{false}}"><span>Low</span></sc-if>
</button>
<button onClick="{{goStats}}" aria-label="{{todayPtsAria}}" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A2D33; background: #16181B; color: #EDEEF0; font-size: 15px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{accent}}" stroke="none" aria-hidden="true"><polygon points="13 2 4 14 11 14 10 22 20 9 13 9 13 2"></polygon></svg>
{{todayPts}}
</button>
</div>
</div>

<!-- Morning check-in -->
<sc-if value="{{checkin.show}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; background: #16181B; border: 1px solid {{accent}}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">Morning check-in · {{checkin.stepLabel}}</span>
<sc-if value="{{checkin.step1}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 600">How's your energy?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{checkin.energies}}" as="e" hint-placeholder-count="3">
<button onClick="{{e.pick}}" style="min-height: 48px; border-radius: 14px; border: 1px solid #3A3E45; background: #1E2125; color: #EDEEF0; font-size: 15px; font-weight: 700">{{e.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{checkin.step2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 600">What's the one must-do today?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{checkin.options}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3E45; background: #1E2125; color: #EDEEF0; font-size: 14px; font-weight: 600">{{o.title}}</button>
</sc-for>
</div>
<sc-if value="{{checkin.noOptions}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: #A0A4AC">Nothing planned yet. Add goals and tasks, or just skip for today.</span></sc-if>
<button onClick="{{checkin.skip}}" style="align-self: flex-start; min-height: 44px; padding: 0 14px; border: 1px solid #3A3E45; border-radius: 12px; background: transparent; color: #EDEEF0; font-size: 13px; font-weight: 600">Skip</button>
</div>
</sc-if>
</div>
</sc-if>

<!-- Now -->
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 20px; background: {{now.bg}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{now.dot}}"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{now.label}}">Now · {{now.clock}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700; color: {{now.fg}}">{{now.title}}</span>
<span style="flex: none; font-size: 14px; font-weight: 600; color: {{now.sub}}">{{now.range}}</span>
</div>
<sc-if value="{{now.hasBar}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 4px; border-radius: 2px; background: {{now.track}}; overflow: hidden">
<div style="height: 4px; border-radius: 2px; width: {{now.pct}}%; background: {{now.fg}}"></div>
</div>
<span style="font-size: 12px; font-weight: 600; color: {{now.sub}}">{{now.left}}</span>
</div>
</sc-if>
</div>

<!-- Next / Focus -->
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; background: #16181B; border: 1px solid #2A2D33">
<sc-if value="{{focus.on}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">In focus</span>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 17px; font-weight: 600">{{focus.title}}</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums">{{focus.left}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A4AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="font-size: 12px; color: #A0A4AC">Blocked until done:</span>
<span style="padding: 3px 8px; border-radius: 999px; background: #23262B; font-size: 12px; font-weight: 600">YouTube</span>
<span style="padding: 3px 8px; border-radius: 999px; background: #23262B; font-size: 12px; font-weight: 600">Instagram</span>
<span style="padding: 3px 8px; border-radius: 999px; background: #23262B; font-size: 12px; font-weight: 600">TikTok</span>
</div>
<div style="display: flex; gap: 10px">
<button onClick="{{focus.done}}" style="flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: {{accent}}; color: #1A1405; font-size: 15px; font-weight: 700">Done</button>
<button onClick="{{focus.stop}}" style="flex: 1; min-height: 48px; border: 1px solid #3A3E45; border-radius: 14px; background: transparent; color: #EDEEF0; font-size: 15px; font-weight: 600">Stop</button>
</div>
</div>
</sc-if>
<sc-if value="{{focus.off}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A4AC">{{next.label}}</span>
<sc-if value="{{next.isMust}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: {{accent}}">Must-do</span></sc-if>
</div>
<span style="font-size: 19px; font-weight: 600">{{next.title}}</span>
<sc-if value="{{next.has}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px; align-items: baseline">
<span style="flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">First step</span>
<span style="font-size: 14px; color: #C4C7CD">{{next.starter}}</span>
</div>
<sc-if value="{{next.bounty}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: {{accent}}; color: #1A1405; font-size: 12px; font-weight: 700">Bounty +{{next.bonus}} · skipped {{next.days}} days</span>
</sc-if>
<div style="display: flex; gap: 10px">
<button onClick="{{next.start}}" style="flex: 1; min-height: 48px; border: 0; border-radius: 14px; background: {{accent}}; color: #1A1405; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
Start {{next.mins}} min
</button>
<button onClick="{{next.done}}" style="flex: 1; min-height: 48px; border: 1px solid #3A3E45; border-radius: 14px; background: transparent; color: #EDEEF0; font-size: 15px; font-weight: 600">Done</button>
</div>
</div>
</sc-if>
</div>
</sc-if>
</div>

<!-- Schedule -->
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0 0 2px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Schedule</h2>
<span style="font-size: 13px; color: #A0A4AC">{{doneCount}} of {{itemCount}} done</span>
</div>
<sc-for list="{{todayItems}}" as="t" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 4px; min-height: 60px; box-sizing: border-box; background: #16181B; border-radius: 16px; border: 1px solid {{t.border}}">
<button onClick="{{t.tap}}" aria-label="{{t.tapLabel}}" aria-pressed="{{t.done}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
<span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 8px; border: 2px solid {{t.ring}}; background: {{t.fill}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1405" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"></polyline></svg></sc-if>
</span>
</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600; color: {{t.color}}; text-decoration: {{t.deco}}">{{t.title}}</span>
<span style="font-size: 12px; color: {{t.metaColor}}">{{t.meta}}</span>
</div>
<sc-if value="{{t.showBounty}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 4px 10px; border-radius: 999px; background: {{accent}}; color: #1A1405; font-size: 12px; font-weight: 700">+{{t.bonus}}</span>
</sc-if>
<sc-if value="{{t.showPts}}" hint-placeholder-val="{{true}}">
<span style="flex: none; font-size: 13px; font-weight: 700; color: {{t.ptsColor}}">{{t.ptsText}}</span>
</sc-if>
</div>
</sc-for>
</section>

<!-- Anytime picks -->
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Anytime</h2>
<button onClick="{{goTasks}}" style="min-height: 44px; border: 0; background: none; padding: 0; color: {{accent}}; font-size: 14px; font-weight: 700">Pick a task</button>
</div>
<sc-for list="{{picks}}" as="t" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; min-height: 52px; box-sizing: border-box; border-bottom: 1px solid #23262B">
<button onClick="{{t.tap}}" aria-label="{{t.tapLabel}}" aria-pressed="{{t.done}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid {{t.ring}}; background: {{t.fill}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1A1405" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"></polyline></svg></sc-if>
</span>
</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: {{t.color}}; text-decoration: {{t.deco}}">{{t.title}}</span>
<span style="font-size: 12px; color: #A0A4AC">{{t.meta}}</span>
</div>
<span style="flex: none; font-size: 13px; font-weight: 700; color: {{t.ptsColor}}">{{t.ptsText}}</span>
</div>
</sc-for>
<sc-if value="{{noPicks}}" hint-placeholder-val="{{false}}">
<span style="font-size: 14px; color: #A0A4AC; padding: 8px 0">Nothing picked yet. Grab a small task from your list when you have a gap.</span>
</sc-if>
</section>

<button onClick="{{openEvening}}" style="min-height: 56px; border-radius: 16px; border: 1px dashed #3A3E45; background: transparent; color: #EDEEF0; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
Evening review
</button>
</div>
</sc-if>

<!-- ============ WEEK ============ -->
<sc-if value="{{show.week}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A4AC">{{_weekLabel}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Week</h1>
</div>


<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-pressed="{{d.selected}}" aria-label="{{d.aria}}" style="min-height: 64px; border-radius: 14px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0">
<span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">{{d.short}}</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">{{d.date}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 4px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 600">{{dayTitle}}</h2>
<sc-for list="{{weekItems}}" as="b" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; min-height: 58px; box-sizing: border-box; border-radius: 16px; background: {{b.bg}}; border: 1px {{b.borderStyle}} {{b.borderColor}}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600; color: {{b.color}}; text-decoration: {{b.deco}}">{{b.title}}</span>
<span style="font-size: 12px; color: #A0A4AC">{{b.meta}}</span>
</div>
<sc-if value="{{b.isSuggested}}" hint-placeholder-val="{{false}}">
<button onClick="{{b.accept}}" aria-label="{{b.acceptLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: {{accent}}; color: #1A1405; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"></polyline></svg>
</button>
</sc-if>
<sc-if value="{{b.isFixed}}" hint-placeholder-val="{{false}}">
<button onClick="{{b.cancel}}" style="min-height: 44px; flex: none; padding: 0 12px; border: 1px solid #3A3E45; border-radius: 12px; background: transparent; color: #EDEEF0; font-size: 13px; font-weight: 600">{{b.cancelText}}</button>
<button onClick="{{b.deleteFixed}}" aria-label="{{b.removeLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent; color: #80848C; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
</button>
</sc-if>
<sc-if value="{{b.canRemove}}" hint-placeholder-val="{{true}}">
<button onClick="{{b.remove}}" aria-label="{{b.removeLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent; color: #80848C; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</button>
</sc-if>
</div>
</sc-for>
<sc-if value="{{dayEmpty}}" hint-placeholder-val="{{false}}">
<span style="font-size: 14px; color: #A0A4AC; padding: 8px 0">Nothing planned. A free day.</span>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; border: 1px dashed #3A3E45">
<h3 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600">Add a fixed block to {{dayShort}}</h3>
<label for="nb-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What</label>
<input id="nb-title" value="{{nb.title}}" onChange="{{nb.onTitle}}" placeholder="e.g. French course" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #2A2D33; background: #16181B; color: #EDEEF0; font-size: 15px">
<div style="display: flex; align-items: center; gap: 8px">
<label for="nb-time" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">From</label>
<input id="nb-time" type="time" value="{{nb.time}}" onChange="{{nb.onTime}}" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 14px; border: 1px solid #2A2D33; background: #16181B; color: #EDEEF0; font-size: 15px; color-scheme: dark">
<span aria-hidden="true" style="color: #A0A4AC">–</span>
<label for="nb-end" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Until</label>
<input id="nb-end" type="time" value="{{nb.end}}" onChange="{{nb.onEnd}}" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 14px; border: 1px solid #2A2D33; background: #16181B; color: #EDEEF0; font-size: 15px; color-scheme: dark">
</div>
<button onClick="{{nb.add}}" style="min-height: 48px; border: 0; border-radius: 14px; background: {{accent}}; color: #1A1405; font-size: 15px; font-weight: 700">Add · repeats weekly</button>

Today
</button>
<button onClick="{{tabs.week.go}}" aria-current="{{tabs.week.current}}" style="min-height: 52px; border: 0; background: transparent; color: {{tabs.week.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg>
Week
</button>
<button onClick="{{tabs.goals.go}}" aria-current="{{tabs.goals.current}}" style="min-height: 52px; border: 0; background: transparent; color: {{tabs.goals.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.2"></circle></svg>
Goals
</button>
<button onClick="{{tabs.stats.go}}" aria-current="{{tabs.stats.current}}" style="min-height: 52px; border: 0; background: transparent; color: {{tabs.stats.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="13"></line><line x1="12" y1="20" x2="12" y2="8"></line><line x1="18" y1="20" x2="18" y2="4"></line></svg>
Stats
</button>
</nav>

<sc-if value="{{toast.show}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 100px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 16px; background: #EDEEF0; color: #141518; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">{{toast.text}}</span>
<button onClick="{{toast.undo}}" style="min-height: 44px; flex: none; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #141518; font-size: 14px; font-weight: 800; text-decoration: underline">Undo</button>
<button onClick="{{toast.close}}" aria-label="Dismiss" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: transparent; color: #141518; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</button>
</div>
</sc-if>

<!-- ============ REFLECTION SHEET ============ -->
<sc-if value="{{rf.show}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-label="How did it go?" style="display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 40px; border-radius: 28px 28px 0 0; background: #16181B; border-top: 1px solid #2A2D33">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">Done</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">{{rf.title}}</span>
</div>
<sc-if value="{{rf.asking}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">How focused were you?</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{rf.focusOpts}}" as="o" hint-placeholder-count="5">
<button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 52px; border-radius: 14px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 700">{{o.n}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #80848C"><span>Distracted</span><span>Locked in</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Did you stay off your phone?</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{rf.phoneOpts}}" as="o" hint-placeholder-count="2">
<button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 52px; border-radius: 14px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 15px; font-weight: 700">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{rf.result}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 48px; font-weight: 700; color: {{accent}}">+{{rf.total}}</span>
<span style="font-size: 14px; color: #A0A4AC">points</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rf.lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #C4C7CD">{{l.label}}</span><span style="font-weight: 700">{{l.v}}</span></div>
</sc-for>
</div>
<sc-if value="{{rf.followUp}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #1E2125">
<span style="font-size: 14px">Any task done beats none. One more small one?</span>
<button onClick="{{rf.startFollow}}" style="min-height: 48px; border: 0; border-radius: 14px; background: {{accent}}; color: #1A1405; font-size: 15px; font-weight: 700">Start: {{rf.followTitle}}</button>
</div>
</sc-if>
<button onClick="{{rf.close}}" style="min-height: 48px; border: 1px solid #3A3E45; border-radius: 14px; background: transparent; color: #EDEEF0; font-size: 15px; font-weight: 600">{{rf.closeText}}</button>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- ============ EVENING REVIEW ============ -->
<sc-if value="{{ev.show}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: #0E0F11; display: flex; flex-direction: column">
<div class="scroll" role="dialog" aria-label="Evening review" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: calc(max(env(safe-area-inset-top, 0px), 50px) + 30px) 20px 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A0A4AC">{{_hdrShort}}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Evening review</h1>
</div>
<button onClick="{{ev.close}}" aria-label="Close review" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #16181B; color: #EDEEF0; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 20px; background: #16181B">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 44px; font-weight: 700; line-height: 1">{{todayPts}}</span>
<span style="font-size: 14px; color: #A0A4AC">points today · {{ev.vsAvg}}</span>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 2px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Leftovers</h2>
<sc-for list="{{ev.left}}" as="l" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; min-height: 60px; box-sizing: border-box; border-radius: 16px; background: #16181B">
<span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">{{l.title}}</span>
<button onClick="{{l.move}}" style="min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: {{accent}}; color: #1A1405; font-size: 13px; font-weight: 700">{{l.moveText}}</button>
<button onClick="{{l.drop}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #3A3E45; border-radius: 12px; background: transparent; color: #EDEEF0; font-size: 13px; font-weight: 600">Drop</button>
</div>
</sc-for>
<sc-if value="{{ev.noLeft}}" hint-placeholder-val="{{false}}">
<span style="font-size: 14px; color: #A0A4AC">Nothing left over. Clean day.</span>
</sc-if>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 2px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Tomorrow</h2>
<sc-for list="{{ev.tomorrow}}" as="b" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; padding: 12px 16px; border-radius: 14px; background: #16181B">
<span style="width: 44px; flex: none; font-size: 13px; color: #A0A4AC; font-variant-numeric: tabular-nums">{{b.start}}</span>
<span style="font-size: 15px; font-weight: 600">{{b.title}}</span>
</div>
</sc-for>
</section>
<button onClick="{{ev.close}}" style="min-height: 52px; border: 0; border-radius: 14px; background: {{accent}}; color: #1A1405; font-size: 16px; font-weight: 700">Close the day</button>
</div>
</div>
</sc-if>

</div>
</template>
