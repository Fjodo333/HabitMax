<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Productivity Planner">
<meta name="theme-color" content="#0E0F11">
<title>Productivity Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23F5B841' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='%231A1405' text-anchor='middle' dy='.3em'>P</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23F5B841' width='192' height='192' rx='40'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='%231A1405' text-anchor='middle' dy='.3em'>P</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --accent: #F5B841;
  --bg: #0E0F11;
  --bg-card: #16181B;
  --bg-hover: #1E2125;
  --text-primary: #EDEEF0;
  --text-secondary: #A0A4AC;
  --text-tertiary: #80848C;
  --border: #2A2D33;
  --border-light: #3A3E45;
  --growth: #4CD787;
  --energy: #FF7A3D;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
}

button, input, select, textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
  border: none;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

input[type="time"] {
  color-scheme: dark;
}

.scroll::-webkit-scrollbar {
  display: none;
}

.scroll {
  scrollbar-width: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100vh;
  max-width: 390px;
  max-height: 844px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: max(12px, env(safe-area-inset-top)) 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.tab-bar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  padding: 8px 12px 28px;
  background: #121316;
  border-top: 1px solid #23262B;
}

.tab-button {
  min-height: 52px;
  background: transparent;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 0;
  border: 0;
  transition: color 0.2s;
}

.tab-button.active {
  color: var(--accent);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.header {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.header-date {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.header-title {
  margin: 0;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #FF0000;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
}

.card-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.button-group {
  display: flex;
  gap: 10px;
}

.button-primary {
  flex: 1;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: #1A1405;
  font-size: 15px;
  font-weight: 700;
}

.button-secondary {
  min-height: 48px;
  padding: 0 16px;
  border: 1px solid var(--border-light);
  border-radius: 14px;
  background: transparent;
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
}

.icon {
  width: 16px;
  height: 16px;
  display: inline-block;
}

.checkbox {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 2px solid #5A5F68;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}

.checkbox.done {
  border-color: var(--accent);
  background: var(--accent);
}

.toast {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 100px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 8px 8px 16px;
  border-radius: 16px;
  background: var(--text-primary);
  color: #141518;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.modal {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 24px 20px 40px;
  border-radius: 28px 28px 0 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  max-height: 90vh;
  overflow-y: auto;
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>

<div id="app">
  <div class="container scroll" id="container"></div>
  <nav class="tab-bar">
    <button class="tab-button active" data-tab="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line></svg>
      Today
    </button>
    <button class="tab-button" data-tab="week">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg>
      Week
    </button>
    <button class="tab-button" data-tab="goals">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.2"></circle></svg>
      Goals
    </button>
    <button class="tab-button" data-tab="stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="13"></line><line x1="12" y1="20" x2="12" y2="8"></line><line x1="18" y1="20" x2="18" y2="4"></line></svg>
      Stats
    </button>
  </nav>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ============ STATE & CONSTANTS ============
const TODAY = 1;
const DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const DATES = [5, 6, 7, 8, 9, 10, 11];

const DEFAULT_GOALS = [
  { id: 'french', name: 'French', desc: 'Speak French with confidence by December.', doneWhen: 'a 15-min conversation without switching to English', milestones: [{ id: 'm1', title: 'First 500 words learned', when: 'end of Oct' }, { id: 'm2', title: '15-min conversation with a local', when: 'Dec' }] },
  { id: 'fit', name: 'Get top fit', desc: 'Gym and swimming are going well. Run more often.', doneWhen: 'running 10 km comfortably', milestones: [{ id: 'm3', title: 'Run 5 km without stopping', when: 'end of Oct' }, { id: 'm4', title: 'Run 10 km', when: 'Dec' }] },
  { id: 'ai', name: 'Build an AI project', desc: 'Learn to use AI properly and build something worth putting on the CV.', doneWhen: 'a working app other people can try', milestones: [{ id: 'm5', title: 'First working prototype', when: 'this month' }, { id: 'm6', title: 'Shown to 5 people', when: 'Nov' }] },
  { id: 'uni', name: 'Uni: pass everything', desc: 'Low priority. Steady effort, no overkill.', doneWhen: 'all courses passed', milestones: [{ id: 'm7', title: 'All deadlines in the calendar', when: 'this week' }, { id: 'm8', title: 'All courses passed', when: 'Dec' }] },
  { id: 'org', name: 'Get organised', desc: 'Know what to do each day, so starting is easy.', doneWhen: 'using the planner every day for a month', milestones: [{ id: 'm9', title: '7 evening reviews in a row', when: 'next week' }] },
  { id: 'wake', name: 'Early rise', desc: 'One steady rhythm: up around 7, every day.', doneWhen: 'up by 7:00 for 30 days', milestones: [{ id: 'm10', title: '14 days in a row', when: 'end of Oct' }] }
];

const GROWTH = '#4CD787';
const ENERGY = '#FF7A3D';
const EFFORT = { '5 min': 5, '30 min': 10, '1 hour': 20 };

const HIST_DAILY = [30, 52, 34, 61, 44, 70, 66, 38, 58, 35, 55, 47];
const HIST_WEEKLY = [31, 34, 30, 37, 40, 38, 43, 41, 46, 49, 47, 52];
const HIST_WEEKDAY = [62, 60, 36, 55, 39, 50, 44];
const HIST_GOALS = { french: 310, fit: 420, ai: 190, uni: 380, org: 120, wake: 110 };
const HIST_FOCUS = [{ name: 'Morning', sum: 41, n: 10 }, { name: 'Midday', sum: 23, n: 7 }, { name: 'Afternoon', sum: 26, n: 9 }, { name: 'Evening', sum: 29, n: 8 }];
const HIST_PHONE = { yes: 19, n: 34 };

class PlannerApp {
  constructor() {
    this.state = {
      tab: 'today',
      low: false,
      rec: {},
      focus: null,
      evening: false,
      toast: null,
      day: TODAY
    };
    this.container = document.getElementById('container');
    this.loadState();
    this.render();
    this.attachEventListeners();
    setInterval(() => this.render(), 1000);
  }

  loadState() {
    const saved = localStorage.getItem('planner-state');
    if (saved) {
      try {
        this.state = { ...this.state, ...JSON.parse(saved) };
      } catch (e) {}
    }
  }

  saveState() {
    localStorage.setItem('planner-state', JSON.stringify({
      tab: this.state.tab,
      low: this.state.low,
      rec: this.state.rec,
      focus: this.state.focus,
      evening: this.state.evening,
      day: this.state.day
    }));
  }

  nowMin() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }

  complete(id) {
    if (!this.state.rec[id]) {
      const it = this.findItem(id);
      if (it) {
        const now = new Date();
        this.state.rec[id] = {
          pts: it.pts || 10,
          day: TODAY,
          goal: it.goal || 'org',
          focus: 3,
          phone: true,
          hour: now.getHours(),
          timestamp: Date.now()
        };
        this.saveState();
        this.render();
      }
    }
  }

  undo(id) {
    delete this.state.rec[id];
    this.saveState();
    this.render();
  }

  findItem(id) {
    return { id, title: 'Task', pts: 10, goal: 'org' };
  }

  getTodayPoints() {
    return Object.keys(this.state.rec).reduce((a, k) => {
      const r = this.state.rec[k];
      return a + (r.day === TODAY ? r.pts : 0);
    }, 0);
  }

  render() {
    const html = this.renderTab();
    this.container.innerHTML = html;
    this.attachEventListeners();
  }

  renderTab() {
    const tab = this.state.tab;
    const todayPts = this.getTodayPoints();

    if (tab === 'today') {
      return this.renderToday(todayPts);
    } else if (tab === 'week') {
      return this.renderWeek();
    } else if (tab === 'goals') {
      return this.renderGoals();
    } else if (tab === 'stats') {
      return this.renderStats(todayPts);
    }
    return '';
  }

  renderToday(todayPts) {
    const now = new Date();
    const day = DAY_LONG[now.getDay()];
    const date = now.getDate();

    return `
      <div class="header">
        <span class="header-date">${date} October</span>
        <h1 class="header-title">${day}</h1>
      </div>

      <div style="display: flex; gap: 6px">
        <button class="button-secondary" style="min-height: 44px; padding: 0 12px; border-radius: 999px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line><line x1="6" y1="10" x2="6" y2="14"></line></svg>
          ${this.state.low ? 'Low' : ''}
        </button>
        <button class="button-secondary" style="min-height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; margin-left: auto">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)" stroke="none"><polygon points="13 2 4 14 11 14 10 22 20 9 13 9 13 2"></polygon></svg>
          ${todayPts}
        </button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 20px; background: var(--bg-card)">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: var(--accent)"></span>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Now · ${this.formatTime(this.nowMin())}</span>
        </div>
        <div style="font-size: 24px; font-weight: 700">Free time</div>
        <span style="font-size: 14px; font-weight: 600">Time for an evening review</span>
      </div>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Schedule</h2>
        <p style="color: var(--text-secondary); font-size: 14px">Your schedule will appear here</p>
      </section>

      <button class="button-primary" style="border-radius: 16px; border: 1px dashed var(--border-light); background: transparent; color: var(--text-primary); display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        Evening review
      </button>
    `;
  }

  renderWeek() {
    return `
      <div class="header">
        <span class="header-date">Week 41 · 5–11 Oct</span>
        <h1 class="header-title">Week</h1>
      </div>
      <p style="color: var(--text-secondary); font-size: 14px">Weekly planning features coming soon</p>
    `;
  }

  renderGoals() {
    return `
      <div class="header">
        <span class="header-date">What you're working toward</span>
        <h1 class="header-title">Goals</h1>
      </div>
      <button class="button-primary" style="margin-top: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New goal
      </button>
      <div style="color: var(--text-secondary); font-size: 14px; padding: 16px; background: var(--bg-card); border-radius: 16px">
        <p>You have 6 sample goals ready. Start by creating your own or pick one from the templates.</p>
      </div>
    `;
  }

  renderStats(todayPts) {
    const avg = Math.round(HIST_DAILY.reduce((a, b) => a + b, 0) / HIST_DAILY.length);
    return `
      <div class="header">
        <span class="header-date">Your progress</span>
        <h1 class="header-title">Stats</h1>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
        <div style="padding: 14px; border-radius: 16px; background: var(--bg-card)">
          <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700">${todayPts}</div>
          <span style="font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--accent)"></span>today</span>
        </div>
        <div style="padding: 14px; border-radius: 16px; background: var(--bg-card)">
          <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700">${avg}</div>
          <span style="font-size: 12px; color: var(--text-secondary)">14-day avg</span>
        </div>
        <div style="padding: 14px; border-radius: 16px; background: var(--bg-card)">
          <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700">${todayPts}</div>
          <span style="font-size: 12px; color: var(--text-secondary)">this week</span>
        </div>
      </div>
      <div style="color: var(--text-secondary); font-size: 14px; padding: 16px; background: var(--bg-card); border-radius: 16px">
        <p>Complete tasks today to see your stats populate here.</p>
      </div>
    `;
  }

  formatTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h < 10 ? '0' : ''}${h}:${m < 10 ? '0' : ''}${m}`;
  }

  attachEventListeners() {
    // Tab buttons
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        this.state.tab = tab;
        this.saveState();

        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        this.render();
      });
    });
  }
}

// Initialize app when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  new PlannerApp();
});
</script>

</body>
</html>
